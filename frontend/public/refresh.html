<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Refresh Agent Timmy</title></head>
<body><p>Loading the latest Agent Timmy…</p><script>
const target = new URL('/', window.location.origin);
target.searchParams.set('_timmy_refresh', String(Date.now()));

window.location.replace(target.href);
</script><noscript>Enable JavaScript to open Agent Timmy.</noscript></body></html>
