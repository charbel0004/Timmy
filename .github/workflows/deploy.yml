name: Agent Timmy Deploy

on:
  workflow_run:
    workflows: ["Agent Timmy CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy verified main to Ubuntu
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          vars.TIMMY_DEPLOY_ENABLED == 'true' &&
          vars.TIMMY_DEPLOY_V2_READY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: timmy-production-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger restricted exact-SHA server deployment
        env:
          DEPLOY_KEY: ${{ secrets.TIMMY_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.TIMMY_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.TIMMY_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.TIMMY_DEPLOY_PORT }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$HOST_KEY"
          test -n "$DEPLOY_HOST"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -p "$port" -i ~/.ssh/id_ed25519 \
            "timmy-deploy@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
